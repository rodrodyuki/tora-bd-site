<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>とらのすけくん 11歳おめでとう！クイズ</title>
  <style>
    :root {
      --pink: #ff7fc4;
      --pink-soft: #ffd3ea;
      --sea: #3bb4ff;
      --sea-deep: #1263c2;
      --aqua: #6fe7ff;
      --gold: #ffd86b;
      --ink: #17304a;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Comic Sans MS", "Segoe Print", "Marker Felt", sans-serif;
      background: radial-gradient(1100px 800px at 15% -10%, rgba(255, 211, 234, 0.9) 0%, transparent 60%),
        radial-gradient(900px 700px at 90% 10%, rgba(255, 255, 255, 0.9) 0%, transparent 55%),
        linear-gradient(180deg, #e6f7ff 0%, #a7e0ff 45%, #58b4ff 100%);
      min-height: 100svh;
      overflow-x: hidden;
    }

    .ocean {
      position: fixed;
      inset: 0;
      background: radial-gradient(700px 500px at 70% 80%, rgba(59, 180, 255, 0.35), transparent 60%),
        radial-gradient(500px 400px at 20% 70%, rgba(111, 231, 255, 0.4), transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .waves {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(-8deg, rgba(255, 255, 255, 0.18) 0 12px, rgba(255, 255, 255, 0) 12px 24px);
      opacity: 0.4;
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    .bubble {
      position: absolute;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      opacity: 0.7;
      animation: float 12s infinite ease-in-out;
    }

    .bubble.b1 {
      width: 80px;
      height: 80px;
      left: 6%;
      top: 70%;
      animation-delay: 0s;
    }

    .bubble.b2 {
      width: 50px;
      height: 50px;
      left: 20%;
      top: 80%;
      animation-delay: 2s;
    }

    .bubble.b3 {
      width: 100px;
      height: 100px;
      left: 78%;
      top: 75%;
      animation-delay: 4s;
    }

    .bubble.b4 {
      width: 60px;
      height: 60px;
      left: 88%;
      top: 55%;
      animation-delay: 1s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-60px);
      }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 16px 80px;
    }

    header {
      text-align: center;
      margin-top: 8px;
    }

    .title {
      font-size: clamp(26px, 4vw, 46px);
      margin: 8px 0 6px;
      color: var(--sea-deep);
      text-shadow: 0 3px 0 rgba(255, 255, 255, 0.8);
    }

    .subtitle {
      font-size: clamp(14px, 2.2vw, 20px);
      margin: 0;
      color: #2d6fb2;
    }

    .quiz-card {
      margin: 22px auto 0;
      width: 100%;
      max-width: 900px;
      /* Ensure it takes full available width up to max */
      background: rgba(255, 255, 255, 0.92);
      border-radius: 22px;
      padding: clamp(18px, 3vw, 28px);
      box-shadow: 0 18px 40px rgba(18, 99, 194, 0.15);
      backdrop-filter: blur(6px);
      box-sizing: border-box;
      text-align: center;
    }

    .progress {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: #3a6ea5;
      margin-bottom: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 10px;
      background: #e6f3ff;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar>div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--pink), var(--sea));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .question {
      font-size: clamp(18px, 2.6vw, 24px);
      margin: 12px 0 16px;
      color: var(--ink);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      justify-content: center;
    }

    .choice-btn {
      background: var(--pink-soft);
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, border 0.2s ease, background 0.2s ease;
      min-height: 56px;
    }

    .choice-btn:hover {
      transform: translateY(-2px) scale(1.01);
      border-color: var(--pink);
      background: #ffe7f3;
    }

    .message {
      margin-top: 16px;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef7ff;
      border: 2px dashed #b8dcff;
      min-height: 44px;
    }

    .next-btn {
      margin-top: 10px;
      padding: 10px 18px;
      border: none;
      border-radius: 999px;
      background: var(--sea);
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(59, 180, 255, 0.35);
      display: none;
    }

    .next-btn.show {
      display: inline-block;
    }

    .jellyfish {
      position: absolute;
      width: 90px;
      height: 110px;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #b7f2ff 55%, rgba(59, 180, 255, 0.65) 100%);
      opacity: 0.65;
      animation: drift 16s ease-in-out infinite;
      filter: blur(0.2px);
    }

    .jellyfish::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: 70%;
      height: 54px;
      background: repeating-linear-gradient(90deg,
          rgba(255, 255, 255, 0.85) 0 3px,
          rgba(255, 255, 255, 0) 3px 9px);
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
      border-radius: 0 0 30px 30px;
      filter: drop-shadow(0 4px 6px rgba(59, 180, 255, 0.25));
    }

    .jellyfish::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 70%;
      width: 70px;
      height: 40px;
      border-left: 2px solid rgba(255, 255, 255, 0.6);
      border-right: 2px solid rgba(255, 255, 255, 0.6);
      border-bottom: 2px solid rgba(255, 255, 255, 0.6);
      transform: translateX(-50%);
      border-radius: 0 0 30px 30px;
    }

    .j1 {
      left: 4%;
      top: 18%;
      animation-delay: 0s;
    }

    .j2 {
      left: 85%;
      top: 24%;
      animation-delay: 3s;
      transform: scale(0.8);
    }

    .j3 {
      left: 72%;
      top: 58%;
      animation-delay: 6s;
      transform: scale(0.9);
    }

    .j4 {
      left: 12%;
      top: 60%;
      animation-delay: 2s;
      transform: scale(0.7);
    }

    .j5 {
      left: 92%;
      top: 70%;
      animation-delay: 5s;
      transform: scale(0.6);
    }

    @keyframes drift {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-40px);
      }
    }

    .celebration {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(255, 217, 235, 0.85), transparent 60%),
        linear-gradient(180deg, rgba(255, 247, 252, 0.95) 0%, rgba(217, 242, 255, 0.98) 100%);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      z-index: 10;
      overflow-y: auto;
      width: 100%;
    }

    .celebration.show {
      display: flex;
    }

    .celebrate-title {
      font-size: clamp(30px, 6vw, 60px);
      color: var(--sea-deep);
      margin: 8px 0 10px;
    }

    .celebrate-text {
      font-size: clamp(16px, 2.6vw, 22px);
      color: #2d6fb2;
      max-width: 720px;
    }

    .video-wrap {
      margin: 18px auto 0;
      width: 90%;
      max-width: 720px;
      background: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 12px 30px rgba(18, 99, 194, 0.2);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
      box-sizing: border-box;
      align-self: center;
      flex-shrink: 0;
    }

    .video-wrap.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .video-wrap video {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
      /* Remove bottom space */
    }

    .play-btn {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      background: var(--pink);
      color: white;
      font-size: 16px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(255, 127, 196, 0.35);
    }

    .video-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 14px;
      color: var(--sea-deep);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    .floating-icons {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .floating-art {
      position: absolute;
      width: 78px;
      height: 64px;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(18, 99, 194, 0.25));
      animation: floatIcon 14s ease-in-out infinite;
    }

    .floating-art.a1 {
      left: 8%;
      top: 30%;
      animation-delay: 0s;
    }

    .floating-art.a2 {
      left: 86%;
      top: 32%;
      animation-delay: 2s;
    }

    .floating-art.a3 {
      left: 14%;
      top: 76%;
      animation-delay: 4s;
    }

    .floating-art.a4 {
      left: 78%;
      top: 66%;
      animation-delay: 1s;
    }

    .floating-art.a5 {
      left: 52%;
      top: 18%;
      animation-delay: 3s;
    }

    .floating-art.a6 {
      left: 34%;
      top: 56%;
      animation-delay: 5s;
    }

    .floating-art.a7 {
      left: 60%;
      top: 82%;
      animation-delay: 6s;
    }

    .floating-art.a8 {
      left: 92%;
      top: 10%;
      animation-delay: 7s;
    }

    .floating-art.a9 {
      left: 6%;
      top: 48%;
      animation-delay: 1.5s;
    }

    .floating-art.a10 {
      left: 70%;
      top: 40%;
      animation-delay: 3.5s;
    }

    @keyframes floatIcon {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-26px) rotate(4deg);
      }
    }

    .toy-camera .cam-body {
      position: absolute;
      inset: 10px 6px 6px 6px;
      border-radius: 18px;
      background: linear-gradient(145deg, #8ad9ff, #2f92ff);
      box-shadow: inset 6px 6px 10px rgba(255, 255, 255, 0.55),
        inset -6px -6px 10px rgba(0, 0, 0, 0.12);
    }

    .toy-camera .cam-top {
      position: absolute;
      left: 14px;
      right: 14px;
      top: 2px;
      height: 18px;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffd1ea, #ff76b8);
      box-shadow: inset 4px 4px 8px rgba(255, 255, 255, 0.6),
        inset -4px -4px 8px rgba(0, 0, 0, 0.1);
    }

    .toy-camera .cam-lens {
      position: absolute;
      width: 30px;
      height: 30px;
      right: 16px;
      top: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #a3f0ff 35%, #2a7fd6 70%, #1c4f8b 100%);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .toy-camera .cam-flash {
      position: absolute;
      width: 14px;
      height: 10px;
      left: 18px;
      top: 8px;
      border-radius: 4px;
      background: linear-gradient(145deg, #fff5b5, #ffd86b);
      box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.7);
    }

    .toy-camera .cam-button {
      position: absolute;
      width: 10px;
      height: 10px;
      left: 10px;
      top: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .toy-castle .stone-base {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 4px;
      height: 20px;
      /* Reduced specific base height */
      background: linear-gradient(180deg, #e6e6e6, #c0c0c0);
      clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
      z-index: 1;
    }

    .toy-castle .stone-base::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(0, 0, 0, 0.1) 1px, transparent 1px),
        radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.1) 1px, transparent 1px);
      background-size: 8px 8px;
      opacity: 0.5;
    }

    .toy-castle .wall {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 24px;
      height: 26px;
      background: #ffffff;
      box-shadow: inset 0 -4px 6px rgba(0, 0, 0, 0.05);
      z-index: 2;
    }

    .toy-castle .wall.upper {
      left: 26px;
      right: 26px;
      bottom: 50px;
      height: 26px;
      /* Taller to be visible */
      z-index: 2;
    }

    .toy-castle .roof {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      border-radius: 4px;
      z-index: 3;
      box-shadow: 0 4px 8px rgba(23, 48, 74, 0.3);
    }

    .toy-castle .roof::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 2px;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }

    /* Bottom roof (Moya) */
    .toy-castle .roof.bottom {
      width: 72px;
      height: 14px;
      bottom: 46px;
      /* lowered */
      clip-path: polygon(0% 100%, 5% 0%, 95% 0%, 100% 100%);
    }

    /* Middle roof */
    .toy-castle .roof.middle {
      width: 58px;
      height: 12px;
      bottom: 72px;
      /* raised */
      clip-path: polygon(0% 100%, 8% 0%, 92% 0%, 100% 100%);
    }

    /* Top roof */
    .toy-castle .roof.top {
      width: 44px;
      height: 14px;
      bottom: 84px;
      clip-path: polygon(0% 100%, 12% 10%, 50% 0%, 88% 10%, 100% 100%);
    }

    .toy-castle .castle-top {
      position: absolute;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      width: 28px;
      height: 12px;
      z-index: 4;
    }

    /* Shachihoko (Golden Fish) styling */
    .toy-castle .castle-top::before,
    .toy-castle .castle-top::after {
      content: "";
      position: absolute;
      bottom: -2px;
      width: 8px;
      height: 12px;
      background: var(--gold);
      border-radius: 4px 4px 0 2px;
      box-shadow: inset -1px -1px 2px rgba(0, 0, 0, 0.2);
    }

    .toy-castle .castle-top::before {
      left: 0;
      transform: rotate(-15deg);
    }

    .toy-castle .castle-top::after {
      right: 0;
      transform: scaleX(-1) rotate(-15deg);
    }

    .toy-castle .castle-door {
      position: absolute;
      width: 16px;
      height: 18px;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #cca984;
      /* Wood color */
      border-radius: 8px 8px 0 0;
      box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.1);
      z-index: 3;
    }

    .toy-castle .castle-door::after {
      content: "";
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(139, 69, 19, 0.4);
      border-bottom: none;
      border-radius: 6px 6px 0 0;
    }

    .toy-castle .keep-window {
      position: absolute;
      width: 6px;
      height: 8px;
      left: 50%;
      bottom: 35px;
      /* 1st floor window */
      transform: translateX(-50%);
      background: var(--ink);
      border-radius: 2px;
      z-index: 3;
      box-shadow: 0 -26px 0 var(--ink);
      /* 2nd floor window (35+26=61px) */
    }

    .toy-shachi {
      position: relative;
    }

    .toy-shachi::before,
    .toy-shachi::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      background: #ffd86b;
      clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
      box-shadow: 0 0 8px rgba(255, 216, 107, 0.7);
      opacity: 0.9;
    }

    .toy-shachi::before {
      left: 6px;
      top: 2px;
      transform: rotate(8deg);
    }

    .toy-shachi::after {
      right: 6px;
      top: -2px;
      transform: rotate(-10deg) scale(0.85);
    }

    .toy-shachi .tail {
      position: absolute;
      right: 0;
      top: 6px;
      width: 24px;
      height: 30px;
      background: linear-gradient(145deg, #ffeaa0, #ffb800);
      clip-path: polygon(0% 45%, 25% 10%, 60% 0%, 52% 30%, 100% 25%, 60% 55%, 100% 70%, 52% 70%, 60% 100%, 25% 85%);
      border-radius: 10px;
      box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      filter: drop-shadow(0 2px 0 #d48a00);
      z-index: 1;
    }

    .toy-shachi .crest {
      position: absolute;
      left: 28px;
      top: 2px;
      width: 30px;
      height: 26px;
      background: linear-gradient(145deg, #fff1aa, #ffbf2e);
      clip-path: polygon(0% 100%, 10% 40%, 30% 0%, 45% 35%, 60% 0%, 70% 40%, 85% 10%, 100% 45%, 80% 100%);
      border-radius: 12px;
      box-shadow: inset 3px 3px 6px rgba(255, 255, 255, 0.7);
      filter: drop-shadow(0 2px 0 #d48a00);
      z-index: 4;
    }

    .toy-shachi .fin-side {
      position: absolute;
      right: 18px;
      top: 28px;
      width: 22px;
      height: 16px;
      background: linear-gradient(145deg, #fff1aa, #ffbf2e);
      clip-path: polygon(0% 80%, 35% 0%, 100% 40%, 70% 100%);
      border-radius: 10px;
      box-shadow: inset 2px 2px 4px rgba(255, 255, 255, 0.6);
      filter: drop-shadow(0 2px 0 #d48a00);
      z-index: 2;
    }

    .toy-shachi .body {
      position: absolute;
      left: 18px;
      right: 10px;
      top: 20px;
      height: 24px;
      border-radius: 20px 22px 18px 18px;
      background: linear-gradient(145deg, #ffe79c, #ffb300);
      box-shadow: inset 4px 4px 8px rgba(255, 255, 255, 0.75),
        inset -4px -4px 8px rgba(0, 0, 0, 0.12);
      filter: drop-shadow(0 2px 0 #d48a00);
      z-index: 3;
    }

    .toy-shachi .belly {
      position: absolute;
      left: 26px;
      top: 26px;
      width: 26px;
      height: 14px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(255, 232, 160, 0.9));
      z-index: 4;
    }

    .toy-shachi .ornament {
      position: absolute;
      left: 36px;
      top: 22px;
      width: 18px;
      height: 12px;
      border: 2px solid rgba(214, 140, 0, 0.7);
      border-left: none;
      border-bottom: none;
      border-radius: 50%;
      z-index: 5;
    }

    .toy-shachi .ornament::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 4px;
      width: 10px;
      height: 6px;
      border: 2px solid rgba(214, 140, 0, 0.7);
      border-left: none;
      border-bottom: none;
      border-radius: 50%;
    }

    .toy-shachi .head {
      position: absolute;
      left: 4px;
      top: 20px;
      width: 26px;
      height: 20px;
      border-radius: 16px 10px 14px 16px;
      background: linear-gradient(145deg, #fff2b7, #ffbf45);
      box-shadow: inset 3px 3px 6px rgba(255, 255, 255, 0.7);
      filter: drop-shadow(0 2px 0 #d48a00);
      z-index: 6;
    }

    .toy-shachi .mouth {
      position: absolute;
      left: 0;
      top: 28px;
      width: 24px;
      height: 12px;
      background: #1f140f;
      border-radius: 0 10px 10px 0;
      clip-path: polygon(0% 20%, 100% 0%, 100% 100%, 0% 80%);
      z-index: 7;
    }

    .toy-shachi .teeth {
      position: absolute;
      left: 2px;
      top: 29px;
      width: 18px;
      height: 8px;
      background: #ffffff;
      clip-path: polygon(0% 0%, 20% 100%, 40% 0%, 60% 100%, 80% 0%, 100% 100%, 100% 0%);
      z-index: 8;
    }

    .toy-shachi .eye {
      position: absolute;
      left: 12px;
      top: 24px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: inset 0 0 0 2px #3a2a12;
      z-index: 9;
    }

    .toy-shachi .eye::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #1b140f;
    }

    @media (max-width: 600px) {
      .choice-btn {
        font-size: 15px;

      <button class="play-btn" id="playBtn">動画を再生する</button>
      <a class="video-link" href="celebration.mp4" target="_blank" rel="noopener">再生できないときは動画を開く</a>
    </div>
  </section>

  <script>
    const questions = [
      {
        text: "ゲーム：カービィ最新作で、吸い込んで形が変わる能力の名前は？",
        choices: ["コピー能力", "ホバリング", "ほおばりヘンケイ"],
        answer: 2,
        hint: "ヒント：車や三角すいに変身するよ！"
      },
      {
        text: "ドラえもん：撮るとそっくりの人形が作れる道具は？",
        choices: ["インスタントミニチュア製造カメラ", "きせかえカメラ", "ポラロイドカメラ"],
        answer: 0,
        hint: "ヒント：名前に“ミニチュア”が入っているよ！"
      },
      {
        text: "クラゲ：クラゲの体の何％以上が水でできている？",
        choices: ["80%", "90%", "95%"],
        answer: 2,
        hint: "ヒント：ほとんど水！"
      },
      {
        text: "長崎グルメ：とらのすけくんが長崎で食べたいと言っていた、中国の料理をヒントに作られた料理は？",
        choices: ["カステラ", "ちゃんぽん", "トルコライス"],
        answer: 1,
        hint: "ヒント：麺料理だよ！",
        explanation: "明治時代に中国の留学生のために作られたのが始まりなんだよ！"
      },
      {
        text: "島原城：島原城の天守閣は5階建てですが、屋根の数はいくつある？",
        choices: ["3つ", "5つ", "7つ"],
        answer: 1,
        hint: "ヒント：各階に屋根があるよ！",
        explanation: "各階に屋根がある『5層5階』という珍しい造りなんだよ！"
      },
      {
        text: "島原城（難問）：石垣にある、壁を屏風のように折れ曲がらせた形の名前は？",
        choices: ["算木積み", "屏風折", "狭間"],
        answer: 1,
        hint: "ヒント：屏風のように折れる形だよ！",
        explanation: "お城を守るための工夫なんだ！これでお城博士だね！"
      }
    ];

    const praise = ["正解！すごい！", "やったね！", "大正解！", "かしこい！", "お見事！"];
    const cheer = ["おしい！もう一回いこう！", "がんばって！", "ヒントを見てチャレンジ！", "あと少し！", "いい調子！"];

    let current = 0;

    const questionText = document.getElementById("questionText");
    const choicesEl = document.getElementById("choices");
    const messageArea = document.getElementById("messageArea");
    const nextBtn = document.getElementById("nextBtn");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");
    const celebration = document.getElementById("celebration");
    const quizCard = document.getElementById("quizCard");
    const video = document.getElementById("celebrationVideo");
    const videoWrap = document.getElementById("videoWrap");
    const playBtn = document.getElementById("playBtn");
    let autoAdvanceTimer = null;

    function renderQuestion() {
      clearTimeout(autoAdvanceTimer);
      const q = questions[current];
      questionText.textContent = q.text;
      choicesEl.innerHTML = "";
      q.choices.forEach((choice, idx) => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        btn.textContent = `${String.fromCharCode(65 + idx)}: ${choice}`;
        btn.disabled = false;
        btn.addEventListener("click", () => handleAnswer(idx));
        choicesEl.appendChild(btn);
      });
      progressText.textContent = `${current + 1} / ${questions.length}`;
      progressBar.style.width = `${((current) / questions.length) * 100}%`;
      messageArea.textContent = "がんばってね！";
      nextBtn.classList.remove("show");
    }

    function setChoicesEnabled(enabled) {
      const btns = choicesEl.querySelectorAll("button");
      btns.forEach((btn) => {
        btn.disabled = !enabled;
      });
    }

    function goNext() {
      current += 1;
      if (current >= questions.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }

    function handleAnswer(idx) {
      const q = questions[current];
      if (idx === q.answer) {
        const praiseMsg = praise[Math.floor(Math.random() * praise.length)];
        messageArea.textContent = q.explanation ? `${praiseMsg} ${q.explanation}` : praiseMsg;
        setChoicesEnabled(false);
        nextBtn.textContent = current === questions.length - 1 ? "お祝いへ" : "つぎへ";
        nextBtn.classList.add("show");
        clearTimeout(autoAdvanceTimer);
        autoAdvanceTimer = setTimeout(goNext, 2600);
      } else {
        const cheerMsg = cheer[Math.floor(Math.random() * cheer.length)];
        messageArea.textContent = `${cheerMsg} ${q.hint}`;
      }
    }

    function finishQuiz() {
      quizCard.style.display = "none";
      celebration.classList.add("show");
      startConfetti();
      // 紙吹雪を1.5秒後に停止してリソースを解放（動画再生のため）
      setTimeout(() => {
        stopConfetti();
      }, 1500);
      setTimeout(() => {
        videoWrap.classList.add("show");
        // モバイルの自動再生制限を避けるため、ユーザー操作で再生する
        video.pause();
        video.currentTime = 0;
        video.muted = false;
        playBtn.style.display = "inline-block";
      }, 1800);
    }

    playBtn.addEventListener("click", async () => {
      try {
        video.muted = false;
        video.currentTime = 0;
        await video.play();
        playBtn.style.display = "none";
      } catch {
        window.open("celebration.mp4", "_blank", "noopener");
      }
    });

    nextBtn.addEventListener("click", () => {
      clearTimeout(autoAdvanceTimer);
      goNext();
    });

    // Confetti
    const canvas = document.getElementById("confettiCanvas");
    const ctx = canvas.getContext("2d");
    let confetti = [];
    let confettiAnimId = null;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function createConfettiPiece() {
      const colors = ["#ff7fc4", "#ffd86b", "#3bb4ff", "#6fe7ff", "#ffffff"];
      return {
        x: Math.random() * canvas.width,
        y: -20,
        w: 6 + Math.random() * 6,
        h: 10 + Math.random() * 10,
        vx: -1 + Math.random() * 2,
        vy: 2 + Math.random() * 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * Math.PI
      };
    }

    function startConfetti() {
      confetti = Array.from({ length: 220 }, createConfettiPiece);
      confettiAnimId = requestAnimationFrame(updateConfetti);
    }

    function stopConfetti() {
      if (confettiAnimId) {
        cancelAnimationFrame(confettiAnimId);
        confettiAnimId = null;
      }
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas.style.display = "none";
      confetti = [];
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confetti.forEach((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += 0.05;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();

        if (p.y > canvas.height + 20) {
          p.x = Math.random() * canvas.width;
          p.y = -10;
        }
      });
      confettiAnimId = requestAnimationFrame(updateConfetti);
    }

    renderQuestion();
  </script>
